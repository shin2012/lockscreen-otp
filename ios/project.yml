name: LockscreenOTP
options:
  bundleIdPrefix: kr.b-612
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.6.0'
    CURRENT_PROJECT_VERSION: '1'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  LockscreenOTP:
    type: application
    platform: iOS
    sources: [OTPApp, Shared, AppleShared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.b-612.lockscreenotp
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Shared.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: OTPWidget
        embed: true
  OTPWidget:
    type: app-extension
    platform: iOS
    sources: [OTPWidgets, Shared, AppleShared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.b-612.lockscreenotp.widget
        INFOPLIST_FILE: Config/Widget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Shared.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  LockscreenOTPMac:
    type: application
    platform: macOS
    sources: [MacApp, Shared, AppleShared]
    settings:
      base:
        PRODUCT_NAME: 잠금 OTP
        PRODUCT_MODULE_NAME: LockscreenOTPMac
        PRODUCT_BUNDLE_IDENTIFIER: kr.b-612.lockscreenotp
        INFOPLIST_FILE: Config/Mac-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Mac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - target: OTPWidgetMac
        embed: true
  OTPWidgetMac:
    type: app-extension
    platform: macOS
    sources: [OTPWidgets, Shared, AppleShared]
    settings:
      base:
        PRODUCT_NAME: OTPWidget
        PRODUCT_BUNDLE_IDENTIFIER: kr.b-612.lockscreenotp.widget
        INFOPLIST_FILE: Config/MacWidget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Mac.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
  OTPUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [OTPAppUITests]
    dependencies:
      - target: LockscreenOTP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.b-612.lockscreenotp.uitests
        TEST_TARGET_NAME: LockscreenOTP
schemes:
  LockscreenOTP:
    build:
      targets:
        LockscreenOTP: all
    test:
      targets: [OTPUITests]
  LockscreenOTPMac:
    build:
      targets:
        LockscreenOTPMac: all
